server:
  port: 8080

spring:
  application:
    name: queue-cure-backend

  datasource:
    url: jdbc:mysql://localhost:3306/queue_cure?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: bindu
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  jackson:
    time-zone: UTC

logging:
  level:
    root: INFO
    com.queuecure: DEBUG

# CORS allowed origin for the React dev server
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  ai-service:
    base-url: http://localhost:8000
    timeout-ms: 1500
