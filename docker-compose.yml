version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: queue-cure-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: queue_cure
    ports:
      - "3306:3306"
    volumes:
      - queue_cure_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./ai-service
    container_name: queue-cure-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
    container_name: queue-cure-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/queue_cure?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80,http://localhost
      APP_AI_SERVICE_BASE_URL: http://ai-service:8000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: queue-cure-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  queue_cure_mysql_data:
