version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: queue-cure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: queue_cure
      POSTGRES_PASSWORD: queue_cure
      POSTGRES_DB: queue_cure
    ports:
      - "5432:5432"
    volumes:
      - queue_cure_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue_cure -d queue_cure"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./ai-service
    container_name: queue-cure-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
    container_name: queue-cure-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/queue_cure
      SPRING_DATASOURCE_USERNAME: queue_cure
      SPRING_DATASOURCE_PASSWORD: queue_cure
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80,http://localhost
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: queue-cure-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  queue_cure_postgres_data:
