server:
  port: 8080

spring:
  application:
    name: queue-cure-backend

  datasource:
    url: jdbc:mysql://localhost:3306/queue_cure?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: bindu
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: UTC

logging:
  level:
    root: INFO
    com.queuecure: DEBUG

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173